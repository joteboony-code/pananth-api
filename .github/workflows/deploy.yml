name: Deploy Pananth Rental

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    name: Deploy API Worker to white-rice-cf72
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          ls -la
          test -f worker.js
          test -f wrangler-api.toml

      - name: Deploy API Worker
        run: npx wrangler@latest deploy --config wrangler-api.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-html:
    name: Deploy HTML to pananth
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare HTML assets
        run: |
          mkdir -p .deploy-html
          cp index.html .deploy-html/index.html
          ls -la .deploy-html

      - name: Deploy HTML Worker
        run: npx wrangler@latest deploy --config wrangler-html.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
