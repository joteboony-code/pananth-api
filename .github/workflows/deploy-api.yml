name: Deploy API Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler-api.toml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy white-rice-cf72
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy API Worker
        run: npx wrangler@latest deploy --config wrangler-api.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
