{% extends "base.html" %}
{% block title %}แก้ไขค่าเช่า - ระบบห้องเช่า{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
  <a href="/payments?year={{ payment.year }}&month={{ payment.month }}"
     class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
  <h4 class="mb-0">แก้ไขค่าเช่า — {{ payment.tenant.name }} ห้อง {{ payment.room.number }}</h4>
</div>

<div class="card" style="max-width:520px;">
  <div class="card-body">
    <p class="text-muted">{{ payment.month_name_th }} {{ payment.year + 543 }}</p>
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">ค่าเช่า (บาท)</label>
        <input type="number" name="amount" class="form-control" step="0.01"
               value="{{ payment.amount }}" required>
      </div>

      <div class="row g-2 mb-3">
        <div class="col">
          <label class="form-label fw-semibold">หน่วยน้ำ</label>
          <input type="number" name="water_unit" class="form-control" step="0.01"
                 value="{{ payment.water_unit }}">
        </div>
        <div class="col">
          <label class="form-label fw-semibold">ราคาต่อหน่วย (บาท)</label>
          <input type="number" name="water_rate" class="form-control" step="0.01"
                 value="{{ payment.water_rate }}">
        </div>
      </div>

      <div class="row g-2 mb-3">
        <div class="col">
          <label class="form-label fw-semibold">หน่วยไฟ</label>
          <input type="number" name="electric_unit" class="form-control" step="0.01"
                 value="{{ payment.electric_unit }}">
        </div>
        <div class="col">
          <label class="form-label fw-semibold">ราคาต่อหน่วย (บาท)</label>
          <input type="number" name="electric_rate" class="form-control" step="0.01"
                 value="{{ payment.electric_rate }}">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">สถานะ</label>
        <select name="status" class="form-select">
          <option value="pending" {{ 'selected' if payment.status == 'pending' }}>รอชำระ</option>
          <option value="paid" {{ 'selected' if payment.status == 'paid' }}>ชำระแล้ว</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">หมายเหตุ</label>
        <input type="text" name="note" class="form-control"
               value="{{ payment.note or '' }}" placeholder="หมายเหตุเพิ่มเติม">
      </div>

      <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-lg me-1"></i>บันทึก
      </button>
      <a href="/payments?year={{ payment.year }}&month={{ payment.month }}"
         class="btn btn-outline-secondary ms-2">ยกเลิก</a>
    </form>
  </div>
</div>
{% endblock %}
